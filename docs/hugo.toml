baseURL = "https://kpavlov.github.io/kt-schema/"
title = "kt-schema"
locale = "en"
disableKinds = ["rss", "taxonomy", "term"]
copyright = "© 2026 Konstantin Pavlov and Contributors. Portions copyright JetBrains s.r.o. and contributors."

[params]
  description = "Generate JSON schemas and LLM function calling schemas from Java and Kotlin code — including classes you don't own."
  repo = "https://github.com/kpavlov/kt-schema"

# llms.txt (layouts/home.llms.txt) lists the pages for LLMs; see https://llmstxt.org/.
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

# Every page also gets an index.md (layouts/all.md) for "Copy page" and "View as Markdown".
[outputs]
  home = ["html", "markdown", "llms"]
  page = ["html", "markdown"]

# Highlighting comes from generated styles; baseof.html switches the dark one on and off with its media attribute.
#   hugo gen chromastyles --style=github      > assets/syntax.css
#   hugo gen chromastyles --style=github-dark > assets/syntax-dark.css (keep the rule added at its end)
[markup.highlight]
  noClasses = false

# Guides use <details> to fold long generated schemas.
[markup.goldmark.renderer]
  unsafe = true

# The guides no longer carry a knit-generated table of contents; the layout renders this one.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

# docs/ is also the Gradle `docs` module (Dokka writes to public/api), so mount only the pages.
# README.md is the home page. Add new guides to the list below; each declares its own `menus.main` entry
# (name and weight) in its front matter.
[module]
  [module.hugoVersion]
    min = "0.158.0"
  [[module.mounts]]
    source = "README.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "."
    target = "content"
    files = ["{apt,architecture,configuration,constraints,dsl,function-calling,generated,ksp,reflection,serializable}.md"]
