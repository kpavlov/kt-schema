config:
  validation: true
  warningsAsErrors: true

style:
  VarCouldBeVal:
    ignoreLateinitVar: true


complexity:
  LargeClass:
    excludes: &testFolders
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
  TooManyFunctions:
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 15
    allowedFunctionsPerEnum: 15
  LongMethod:
    ignoreAnnotated:
      - kotlin.test.Test
      - org.junit.jupiter.api.Test