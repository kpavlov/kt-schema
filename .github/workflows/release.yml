name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  JVM_VERSION: 17
  JVM_DISTRIBUTION: temurin

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version from release
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.name }}"
          VERSION="${VERSION#v}"
          echo "ORG_GRADLE_PROJECT_version=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"

      - name: Set up JDK ${{ env.JVM_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JVM_VERSION }}
          distribution: ${{ env.JVM_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Assemble
        run: ./gradlew -PkotlinTargets=full kotlinUpgradePackageLock kotlinWasmUpgradePackageLock assemble

      - name: Publish to Maven Central
        run: ./gradlew -PkotlinTargets=full publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
