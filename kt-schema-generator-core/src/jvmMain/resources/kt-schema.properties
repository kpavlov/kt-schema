# kt-schema Configuration
#
# This file configures annotation detection for schema generation.
# Place a copy in your project's resources to override these defaults.
#
# Every annotation-name and nullable/optional type-name property below is a comma-separated list
# of glob patterns (`*` matches any run of characters, `?` matches a single character); a plain
# literal name (no `*`/`?`) is just a pattern that matches itself. These entries are all matched
# the same way — reusing the shared glob matcher (globToRegex) used elsewhere in the library (e.g.
# KSP's include/exclude package filters) — so e.g. `Json*` matches `JsonIgnore`, `JsonIgnoreType`,
# `JsonProperty`, etc. (introspector.opaque.type.names below is the exception: it's a plain list
# of exact fully qualified class names, not glob patterns.)

## Annotation simple names to recognize as description providers
## Format: Comma-separated list of glob patterns (case-insensitive matching)
## Note: Matching is case-insensitive. "Description" matches @Description, @description, @DESCRIPTION
##
## Default annotations supported:
## - Description (kt-schema)
## - SerialDescription (kt-schema)
## - LLMDescription (Koog AI agents)
## - JsonPropertyDescription (Jackson)
## - JsonClassDescription (Jackson, for classes)
## - P (LangChain4j)
introspector.annotations.description.names=Description,SerialDescription,LLMDescription,JsonPropertyDescription,JsonClassDescription,P

## Annotation parameter names that contain description text (exact names, not glob patterns)
## Format: Comma-separated list (case-insensitive matching)
## Note: The first matching parameter with a non-null String value is used
##
## Default attributes checked:
## - value: Standard for annotations like @Description("text")
## - description: Common for verbose annotations like @JsonPropertyDescription(description = "text")
introspector.annotations.description.attributes=value,description

## Annotation simple names to recognize as ignore markers
## Classes annotated with any of these are excluded from schema generation
## (e.g. sealed subtypes omitted from polymorphic oneOf schemas)
## Format: Comma-separated list of glob patterns (case-insensitive matching)
##
## Default annotations supported:
## - SchemaIgnore (kt-schema)
## - SerialSchemaIgnore (kt-schema, serialization-aware)
## - JsonIgnoreType (Jackson, for types)
## - JsonIgnore (Jackson, for properties/fields)
introspector.annotations.ignore.names=\
  SchemaIgnore,\
  SerialSchemaIgnore,\
  JsonIgnoreType,\
  JsonIgnore

## Annotation names recognized as name-override providers
## Names containing a dot are treated as fully qualified names (FQN) glob patterns and matched
## case-sensitively. Names without a dot are simple-name glob patterns matched case-insensitively.
##
## Default annotations supported:
## - kotlinx.serialization.SerialName (kotlinx.serialization, matched by FQN)
## - com.fasterxml.jackson.annotation.JsonProperty (Jackson, matched by FQN)
## - com.fasterxml.jackson.annotation.JsonTypeName (Jackson, matched by FQN)
introspector.annotations.name.names=\
  kotlinx.serialization.SerialName,\
  com.fasterxml.jackson.annotation.JsonProperty,\
  com.fasterxml.jackson.annotation.JsonTypeName

## Annotation parameter names that contain name-override text (exact names, not glob patterns)
## Format: Comma-separated list (case-insensitive matching)
introspector.annotations.name.attributes=value

## Annotation simple names to recognize as nullable markers (e.g. @Nullable)
## A property carrying one of these annotations is treated as if its type were nullable,
## the same way Kotlin's `?` is handled — mainly useful for front ends without native nullable
## types (e.g. Java/APT).
## Format: Comma-separated list of glob patterns (case-insensitive matching)
## Note: a single simple-name entry like "Nullable" already matches javax.annotation.Nullable,
## jakarta.annotation.Nullable, org.jetbrains.annotations.Nullable, org.jspecify.annotations.Nullable,
## etc., since they all share that simple name.
introspector.annotations.nullable.names=Nullable

## Glob patterns matched against a property's resolved type's simple class name (a plain literal
## name with no `*`/`?` just matches itself). A match marks the property nullable, the same way
## Kotlin's `?` is handled — e.g. a type literally named `EmailOpt` matches the default `*Opt`.
## Format: Comma-separated list of glob patterns. Matching is case-sensitive.
introspector.nullable.type.names=*Opt

## Annotation simple names to recognize as optional markers.
## A property carrying one of these annotations is excluded from the emitted schema's `required`
## array, the same way a Kotlin default value is handled — mainly useful for front ends without
## native default-value support (e.g. Java/APT).
## Format: Comma-separated list of glob patterns (case-insensitive matching)
## No default: `@Nullable` permits a null value but does not omit the property.
introspector.annotations.optional.names=

## Glob patterns matched against a property's resolved type's simple class name. A match excludes
## the property from the emitted schema's `required` array.
## Format: Comma-separated list of glob patterns. Matching is case-sensitive.
## No default: unlike introspector.nullable.type.names, this is opt-in only — a type-name-based
## default here would silently exclude too many unrelated classes from `required`. Set it
## explicitly if you want this convention.
introspector.optional.type.names=

## Annotation names recognized as enum-default-value markers, placed on a single enum constant to
## mark it as that enum type's default value — emitted as the `default` keyword on the enum's own
## schema (so every property referencing that enum inherits it via `$ref`).
## Names containing a dot are treated as fully qualified names (FQN) glob patterns and matched
## case-sensitively. Names without a dot are simple-name glob patterns matched case-insensitively.
##
## Default annotations supported:
## - com.fasterxml.jackson.annotation.JsonEnumDefaultValue (Jackson, matched by FQN)
##
## Note: kotlinx.serialization has no equivalent annotation. Even a plain Jackson annotation placed
## on an enum entry is invisible to the kotlinx.serialization-based introspector, since
## SerialDescriptor only preserves annotations meta-annotated with `@SerialInfo` — this property
## does not apply to that front end.
introspector.annotations.enumDefault.names=com.fasterxml.jackson.annotation.JsonEnumDefaultValue

## Annotation names recognized as default-value providers (e.g. Jackson's documented
## schema-metadata attribute `@JsonProperty(defaultValue = "...")`). Populates a property's default
## value in the emitted schema — mainly useful for front ends without native default-value support
## (APT, KSP); for reflection, a real Kotlin default value always takes precedence when both are
## present.
## Names containing a dot are treated as fully qualified names (FQN) glob patterns and matched
## case-sensitively. Names without a dot are simple-name glob patterns matched case-insensitively.
##
## Default annotations supported:
## - com.fasterxml.jackson.annotation.JsonProperty (Jackson, matched by FQN)
introspector.annotations.defaultValue.names=com.fasterxml.jackson.annotation.JsonProperty

## Annotation parameter names that contain default-value text (exact names, not glob patterns)
## Format: Comma-separated list (case-insensitive matching)
introspector.annotations.defaultValue.attributes=defaultValue

## Annotation names recognized as discriminator-property-name providers for polymorphic (sealed)
## types (e.g. `@JsonClassDiscriminator("outcome")`). When no matching annotation is found, a
## polymorphic type's discriminator property name falls back to "type".
## Names containing a dot are treated as fully qualified names (FQN) glob patterns and matched
## case-sensitively. Names without a dot are simple-name glob patterns matched case-insensitively.
##
## Default annotations supported:
## - kotlinx.serialization.json.JsonClassDiscriminator (kotlinx.serialization, matched by FQN)
## - com.fasterxml.jackson.annotation.JsonTypeInfo (Jackson, matched by FQN)
introspector.annotations.discriminator.names=\
  kotlinx.serialization.json.JsonClassDiscriminator,\
  com.fasterxml.jackson.annotation.JsonTypeInfo

## Annotation parameter names that contain the discriminator property name (exact names, not glob
## patterns)
## Format: Comma-separated list (case-insensitive matching)
##
## Default attributes checked:
## - discriminator: kotlinx.serialization's `@JsonClassDiscriminator(discriminator = "...")`
## - property: Jackson's `@JsonTypeInfo(property = "...")`
introspector.annotations.discriminator.attributes=discriminator,property

## Fully qualified class names of types to treat as opaque JSON values
## These types are mapped to `{}` (empty schema) during reflection-based introspection
## instead of being processed through standard object or sealed-type pipelines.
## Note: types with a fixed JSON primitive shape (e.g. Jackson's StringNode, IntNode) are NOT here
## — they resolve to their real primitive schema instead (see DEFAULT_PRIMITIVE_TYPE_KINDS in
## Config.kt), which is not user-configurable via this file.
## Format: Comma-separated list of fully qualified class names
## These defaults should mirror and extend the canonical DEFAULT_OPAQUE_TYPE_NAMES constant (Config.kt),
## which the serialization and KSP generators also share.
introspector.opaque.type.names=\
  kotlinx.serialization.json.JsonElement,\
  kotlinx.serialization.json.JsonPrimitive,\
  kotlinx.serialization.json.JsonNull,\
  tools.jackson.databind.JsonNode,\
  tools.jackson.databind.node.ObjectNode,\
  tools.jackson.databind.node.ArrayNode,\
  tools.jackson.databind.node.ContainerNode,\
  tools.jackson.databind.node.ValueNode,\
  tools.jackson.databind.node.BaseJsonNode,\
  tools.jackson.databind.node.NullNode,\
  tools.jackson.databind.node.MissingNode,\
  tools.jackson.databind.node.POJONode
