# kt-schema Configuration
#
# This file configures annotation detection for schema generation.
# Place a copy in your project's resources to override these defaults.

## Annotation simple names to recognize as description providers
## Format: Comma-separated list (case-insensitive matching)
## Note: Matching is case-insensitive. "Description" matches @Description, @description, @DESCRIPTION
##
## Default annotations supported:
## - Description (kt-schema)
## - SerialDescription (kt-schema)
## - LLMDescription (Koog AI agents)
## - JsonPropertyDescription (Jackson)
## - JsonClassDescription (Jackson, for classes)
## - P (LangChain4j)
introspector.annotations.description.names=Description,SerialDescription,LLMDescription,JsonPropertyDescription,JsonClassDescription,P

## Annotation parameter names that contain description text
## Format: Comma-separated list (case-insensitive matching)
## Note: The first matching parameter with a non-null String value is used
##
## Default attributes checked:
## - value: Standard for annotations like @Description("text")
## - description: Common for verbose annotations like @JsonPropertyDescription(description = "text")
introspector.annotations.description.attributes=value,description

## Annotation simple names to recognize as ignore markers
## Classes annotated with any of these are excluded from schema generation
## (e.g. sealed subtypes omitted from polymorphic oneOf schemas)
##
## Default annotations supported:
## - SchemaIgnore (kt-schema)
## - SerialSchemaIgnore (kt-schema, serialization-aware)
## - JsonIgnoreType (Jackson, for types)
## - JsonIgnore (Jackson, for properties/fields)
introspector.annotations.ignore.names=\
  SchemaIgnore,\
  SerialSchemaIgnore,\
  JsonIgnoreType,\
  JsonIgnore

## Annotation names recognized as name-override providers
## Names containing a dot are treated as fully qualified names (FQN) and matched case-sensitively.
## Names without a dot are matched case-insensitively by simple name.
##
## Default annotations supported:
## - kotlinx.serialization.SerialName (kotlinx.serialization, matched by FQN)
## - com.fasterxml.jackson.annotation.JsonProperty (Jackson, matched by FQN)
## - com.fasterxml.jackson.annotation.JsonTypeName (Jackson, matched by FQN)
introspector.annotations.name.names=\
  kotlinx.serialization.SerialName,\
  com.fasterxml.jackson.annotation.JsonProperty,\
  com.fasterxml.jackson.annotation.JsonTypeName

## Annotation parameter names that contain name-override text
## Format: Comma-separated list (case-insensitive matching)
introspector.annotations.name.attributes=value

## Fully qualified class names of types to treat as opaque JSON values
## These types are mapped to `{}` (empty schema) during reflection-based introspection
## instead of being processed through standard object or sealed-type pipelines.
## Format: Comma-separated list of fully qualified class names
## These defaults should mirror and extend the canonical DEFAULT_OPAQUE_TYPE_NAMES constant (Config.kt),
## which the serialization and KSP generators also share.
introspector.opaque.type.names=\
  kotlinx.serialization.json.JsonElement,\
  kotlinx.serialization.json.JsonPrimitive,\
  kotlinx.serialization.json.JsonNull
